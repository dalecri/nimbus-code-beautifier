<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nimbus</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link id="hljs-theme" rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-dark.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --p: #8b7cf8;
  --gb: rgba(255,255,255,0.13);
  --gb2: rgba(255,255,255,0.22);
  --t: rgba(255,255,255,0.88);
  --t2: rgba(255,255,255,0.45);
  --t3: rgba(255,255,255,0.22);
}

html, body {
  height: 100%; width: 100%;
  overflow: hidden;
  font-family: 'DM Sans', sans-serif;
  background:
    radial-gradient(ellipse 80% 60% at 10% 10%, rgba(108,88,240,0.45) 0%, transparent 55%),
    radial-gradient(ellipse 60% 50% at 90% 85%, rgba(64,180,220,0.35) 0%, transparent 55%),
    radial-gradient(ellipse 50% 40% at 60% 20%, rgba(220,80,160,0.2) 0%, transparent 50%),
    radial-gradient(ellipse 70% 60% at 30% 90%, rgba(40,140,200,0.2) 0%, transparent 55%),
    #0b0b14;
  color: var(--t);
}

/* ── STAGE ── */
#stage {
  position: fixed; inset: 0;
  display: flex; align-items: center; justify-content: center;
  padding: 70px 90px 50px 90px;
  overflow: auto;
}

/* ── CODE CARD ── */
#code-card {
  position: relative; border-radius: 14px; overflow: hidden;
  max-width: 720px; width: 100%;
  box-shadow: 0 24px 64px rgba(0,0,0,0.5), 0 0 0 1px rgba(255,255,255,0.06);
  transition: border-radius 0.15s, max-width 0.15s;
  cursor: text;
}
#card-bg {
  position: absolute; inset: 0; z-index: 0;
  background: linear-gradient(135deg,#7c6af7,#4facfe);
  transition: background 0.3s;
}
#card-inner { position: relative; z-index: 1; padding: 28px; }

#code-block {
  border-radius: 9px; padding: 18px 20px;
  overflow-x: auto; position: relative;
  background: rgba(0,0,0,0.38); min-height: 60px;
}
#code-block::-webkit-scrollbar { height: 3px; }
#code-block::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 2px; }

#lang-badge {
  position: absolute; top: 10px; right: 12px;
  font-size: 9px; font-weight: 700; letter-spacing: 1.1px; text-transform: uppercase;
  padding: 3px 7px; border-radius: 4px;
  background: rgba(255,255,255,0.07); color: rgba(255,255,255,0.35);
  pointer-events: none;
}

#code-lines {
  display: flex; gap: 0;
  font-family: 'Space Mono', monospace;
  font-size: 13px; line-height: 1.75;
  white-space: pre; tab-size: 2; min-height: 1.75em;
}
#line-nums {
  color: rgba(255,255,255,0.2); text-align: right;
  padding-right: 18px; user-select: none; flex-shrink: 0; pointer-events: none;
}
#code-rendered { flex: 1; overflow: hidden; outline: none; white-space: pre; }

#code-ta {
  position: absolute; inset: 0;
  background: transparent; border: none; outline: none; resize: none;
  font-family: 'Space Mono', monospace; font-size: 13px; line-height: 1.75;
  color: transparent; caret-color: rgba(255,255,255,0.85);
  tab-size: 2; white-space: pre; overflow: hidden; z-index: 2; display: none;
}
#edit-hint {
  position: absolute; bottom: 9px; right: 13px;
  font-size: 9px; color: rgba(255,255,255,0.18);
  font-family: 'DM Sans', sans-serif; letter-spacing: 0.3px;
  pointer-events: none; transition: opacity 0.2s;
  user-select: none;
}

/* ── CHROME ── */
#chrome { position: fixed; inset: 0; pointer-events: none; z-index: 100; }
#chrome > * { pointer-events: all; }

/* topbar */
#topbar {
  position: absolute; top: 18px; left: 22px; right: 22px;
  display: flex; align-items: center;
}
.logo {
  display: flex; align-items: center; gap: 7px;
  font-size: 12.5px; font-weight: 600;
  color: rgba(255,255,255,0.42); letter-spacing: -0.2px; user-select: none;
}
.logo-orb {
  width: 7px; height: 7px;
  background: radial-gradient(circle at 35% 35%, #c4baff, #7c6af7);
  border-radius: 50%; box-shadow: 0 0 8px rgba(139,124,248,0.9);
}
.spacer { flex: 1; }
.exports { display: flex; gap: 4px; }
.xbtn {
  background: rgba(255,255,255,0.055); border: 1px solid rgba(255,255,255,0.09);
  color: rgba(255,255,255,0.34); font-family: 'DM Sans', sans-serif;
  font-size: 11px; font-weight: 500; padding: 4px 12px; border-radius: 7px;
  cursor: pointer; transition: all 0.14s;
}
.xbtn:hover { background: rgba(255,255,255,0.11); color: var(--t); border-color: var(--gb); }
.xbtn.go { background: rgba(139,124,248,0.72); border-color: rgba(180,168,255,0.28); color: #fff; }
.xbtn.go:hover { background: rgba(139,124,248,0.9); }

/* icon rail */
#rail {
  position: absolute; left: 22px; top: 50%; transform: translateY(-50%);
  display: flex; flex-direction: column; gap: 2px;
  background: rgba(14,12,32,0.55);
  backdrop-filter: blur(24px) saturate(160%);
  -webkit-backdrop-filter: blur(24px) saturate(160%);
  border: 1px solid var(--gb); border-radius: 14px;
  padding: 6px;
  box-shadow: 0 8px 28px rgba(0,0,0,0.32), inset 0 1px 0 rgba(255,255,255,0.07);
}
.rail-btn {
  width: 34px; height: 34px; border-radius: 9px; border: none;
  background: transparent; color: var(--t2); cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  font-size: 15px; transition: all 0.14s; position: relative;
}
.rail-btn:hover { background: rgba(255,255,255,0.09); color: var(--t); }
.rail-btn.active { background: rgba(139,124,248,0.18); color: var(--p); }
.rail-sep { height: 1px; background: var(--gb); margin: 2px 4px; }

/* popover */
.popover {
  position: absolute; left: 70px; top: 50%; transform: translateY(-50%);
  width: 226px;
  background: rgba(12,10,28,0.78);
  backdrop-filter: blur(32px) saturate(180%); -webkit-backdrop-filter: blur(32px) saturate(180%);
  border: 1px solid var(--gb); border-radius: 16px;
  padding: 14px 0;
  box-shadow: 0 16px 48px rgba(0,0,0,0.45), inset 0 1px 0 rgba(255,255,255,0.07);
  display: none;
}
.popover.open { display: block; }

.pl {
  font-size: 9px; font-weight: 600; letter-spacing: 1.3px; text-transform: uppercase;
  color: var(--t3); padding: 0 14px; margin: 12px 0 5px;
}
.pl:first-child { margin-top: 0; }

.prow { display: flex; align-items: center; gap: 8px; padding: 3px 14px; }
.prl { font-size: 11px; color: var(--t2); flex-shrink: 0; min-width: 56px; }

.prow select {
  flex: 1; background: rgba(255,255,255,0.07); border: 1px solid var(--gb);
  color: var(--t); border-radius: 7px; font-size: 11px;
  font-family: 'DM Sans', sans-serif; padding: 4px 7px;
  outline: none; cursor: pointer; transition: all 0.14s; min-width: 0;
}
.prow select option { background: #1a1a2e; }
.prow select:focus { border-color: rgba(139,124,248,0.6); }
.prow input[type="range"] { flex: 1; accent-color: var(--p); cursor: pointer; }
.prv { font-size: 10px; color: var(--t3); min-width: 20px; text-align: right; }

.psep { height: 1px; background: var(--gb); margin: 8px 14px; }

.pgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 3px; padding: 0 14px; }
.tchip {
  padding: 4px 5px; border-radius: 5px; font-size: 9.5px; font-weight: 600;
  cursor: pointer; border: 1.5px solid transparent; transition: all 0.13s;
  text-align: center; letter-spacing: 0.2px; white-space: nowrap;
  overflow: hidden; text-overflow: ellipsis; opacity: 0.7;
}
.tchip:hover { opacity: 1; }
.tchip.on { border-color: rgba(139,124,248,0.9) !important; opacity: 1; }

.psw-row { display: flex; flex-wrap: wrap; gap: 5px; padding: 0 14px; }
.sw {
  width: 20px; height: 20px; border-radius: 5px; cursor: pointer;
  border: 2px solid transparent; transition: transform 0.11s, border-color 0.11s; flex-shrink: 0;
}
.sw:hover { transform: scale(1.2); }
.sw.on { border-color: rgba(255,255,255,0.9); }
.sw-custom {
  width: 20px; height: 20px; border-radius: 5px;
  border: 1.5px dashed rgba(255,255,255,0.22);
  display: flex; align-items: center; justify-content: center;
  cursor: pointer; position: relative; color: var(--t3); font-size: 13px;
}
.sw-custom input[type="color"] { position: absolute; inset: 0; opacity: 0; width: 100%; height: 100%; cursor: pointer; border: none; }

.ptrow { display: flex; align-items: center; justify-content: space-between; padding: 4px 14px; }
.ptl { font-size: 11px; color: var(--t2); }
.tog { position: relative; width: 32px; height: 18px; cursor: pointer; }
.tog input { display: none; }
.tog-track { position: absolute; inset: 0; background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.14); border-radius: 9px; transition: background 0.16s; }
.tog input:checked + .tog-track { background: rgba(139,124,248,0.8); border-color: rgba(180,168,255,0.4); }
.tog-thumb { position: absolute; top: 3px; left: 3px; width: 11px; height: 11px; background: rgba(255,255,255,0.9); border-radius: 50%; transition: transform 0.16s; pointer-events: none; }
.tog input:checked ~ .tog-thumb { transform: translateX(14px); }

/* ── TOAST ── */
#toast {
  position: fixed; bottom: 20px; right: 20px;
  background: rgba(139,124,248,0.82);
  backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
  border: 1px solid rgba(180,168,255,0.3);
  color: #fff; font-size: 11.5px; font-weight: 500;
  padding: 8px 16px; border-radius: 9px;
  opacity: 0; transform: translateY(5px);
  transition: all 0.2s; pointer-events: none; z-index: 999;
  font-family: 'DM Sans', sans-serif;
}
#toast.show { opacity: 1; transform: translateY(0); }
</style>
</head>
<body>

<!-- CARD STAGE -->
<div id="stage">
  <div id="code-card">
    <div id="card-bg"></div>
    <div id="card-inner">
      <div id="code-block">
        <span id="lang-badge">JS</span>
        <div id="code-lines">
          <div id="line-nums"></div>
          <div id="code-rendered" title="Click to edit"></div>
        </div>
        <textarea id="code-ta" spellcheck="false"></textarea>
        <div id="edit-hint">click to edit</div>
      </div>
    </div>
  </div>
</div>

<!-- FLOATING CHROME -->
<div id="chrome">

  <div id="topbar">
    <div class="logo"><span class="logo-orb"></span> Nimbus</div>
    <div class="spacer"></div>
    <div class="exports">
      <button class="xbtn" onclick="doExport('png')">PNG</button>
      <button class="xbtn" onclick="doExport('jpeg')">JPEG</button>
      <button class="xbtn" onclick="doExport('pdf')">PDF</button>
      <button class="xbtn go" onclick="doExport('png')">↓ Save</button>
    </div>
  </div>

  <div id="rail">
    <button class="rail-btn" id="rb-theme" title="Theme &amp; Language" onclick="togglePanel('theme')">
      <svg width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.7" viewBox="0 0 24 24"><path d="M12 2a10 10 0 1 0 0 20A10 10 0 0 0 12 2z"/><path d="M12 8v8M8 12h8"/></svg>
    </button>
    <button class="rail-btn" id="rb-bg" title="Background" onclick="togglePanel('bg')">
      <svg width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.7" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="8.5" cy="8.5" r="1.5" fill="currentColor" stroke="none"/><path d="M21 15l-5-5L5 21"/></svg>
    </button>
    <div class="rail-sep"></div>
    <button class="rail-btn" id="rb-layout" title="Layout" onclick="togglePanel('layout')">
      <svg width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.7" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="4" rx="1"/><rect x="3" y="10" width="18" height="11" rx="1"/></svg>
    </button>
    <button class="rail-btn" id="rb-opts" title="Options" onclick="togglePanel('opts')">
      <svg width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.7" viewBox="0 0 24 24"><line x1="4" y1="6" x2="20" y2="6"/><line x1="4" y1="12" x2="14" y2="12"/><line x1="4" y1="18" x2="18" y2="18"/></svg>
    </button>
  </div>

  <!-- THEME & LANG POPOVER -->
  <div class="popover" id="pop-theme">
    <div class="pl">Language</div>
    <div class="prow">
      <select id="lang" onchange="onLangChange()">
        <option value="javascript">JavaScript</option>
        <option value="typescript">TypeScript</option>
        <option value="python">Python</option>
        <option value="rust">Rust</option>
        <option value="go">Go</option>
        <option value="java">Java</option>
        <option value="c">C</option>
        <option value="cpp">C++</option>
        <option value="css">CSS</option>
        <option value="html">HTML</option>
        <option value="sql">SQL</option>
        <option value="shell">Bash / Shell</option>
        <option value="yaml">YAML</option>
        <option value="json">JSON</option>
        <option value="ruby">Ruby</option>
        <option value="php">PHP</option>
        <option value="swift">Swift</option>
        <option value="kotlin">Kotlin</option>
        <option value="r">R</option>
        <option value="scala">Scala</option>
      </select>
    </div>
    <div class="psep"></div>
    <div class="pl">Theme</div>
    <div class="pgrid" id="theme-grid"></div>
  </div>

  <!-- BG POPOVER -->
  <div class="popover" id="pop-bg">
    <div class="pl">Background</div>
    <div class="psw-row" id="swatches"></div>
  </div>

  <!-- LAYOUT POPOVER -->
  <div class="popover" id="pop-layout">
    <div class="pl">Card</div>
    <div class="prow">
      <span class="prl">Padding</span>
      <input type="range" min="8" max="80" value="28" oninput="setPad(this.value)">
      <span class="prv" id="v-pad">28</span>
    </div>
    <div class="prow">
      <span class="prl">Width</span>
      <input type="range" min="320" max="960" value="720" oninput="setWidth(this.value)">
      <span class="prv" id="v-width">720</span>
    </div>
    <div class="prow">
      <span class="prl">Radius</span>
      <input type="range" min="0" max="28" value="14" oninput="setRadius(this.value)">
      <span class="prv" id="v-rad">14</span>
    </div>
    <div class="prow">
      <span class="prl">Font</span>
      <input type="range" min="9" max="18" value="13" oninput="setFont(this.value)">
      <span class="prv" id="v-font">13</span>
    </div>
  </div>

  <!-- OPTIONS POPOVER -->
  <div class="popover" id="pop-opts">
    <div class="pl">Display</div>
    <div class="ptrow">
      <span class="ptl">Line numbers</span>
      <label class="tog">
        <input type="checkbox" id="t-lines" checked onchange="setLines()">
        <div class="tog-track"></div><div class="tog-thumb"></div>
      </label>
    </div>
    <div class="ptrow">
      <span class="ptl">Language badge</span>
      <label class="tog">
        <input type="checkbox" id="t-badge" checked onchange="setBadge()">
        <div class="tog-track"></div><div class="tog-thumb"></div>
      </label>
    </div>
  </div>

</div>

<div id="toast"></div>

<script>
const THEMES = [
  { name:'One Dark',    id:'atom-one-dark',     bg:'#282c34', chip:'#1a1d23', chipFg:'#e5c07b' },
  { name:'Dracula',     id:'dracula',            bg:'#282a36', chip:'#1e2029', chipFg:'#ff79c6' },
  { name:'Night Owl',   id:'night-owl',          bg:'#011627', chip:'#010f1a', chipFg:'#7fdbca' },
  { name:'Tokyo Night', id:'tokyo-night-dark',   bg:'#1a1b26', chip:'#10111a', chipFg:'#7aa2f7' },
  { name:'Stack Dark',  id:'stackoverflow-dark', bg:'#1c1b1b', chip:'#111010', chipFg:'#e38c3a' },
  { name:'Nord',        id:'nord',               bg:'#2e3440', chip:'#242932', chipFg:'#88c0d0' },
  { name:'Monokai',     id:'monokai',            bg:'#272822', chip:'#1a1a16', chipFg:'#f92672' },
  { name:'GitHub Dark', id:'github-dark',        bg:'#0d1117', chip:'#050708', chipFg:'#58a6ff' },
  { name:'Obsidian',    id:'obsidian',           bg:'#282b2e', chip:'#1a1c1e', chipFg:'#93c763' },
  { name:'Synthwave',   id:'base16/synth-midnight-terminal-dark', bg:'#20003e', chip:'#140027', chipFg:'#f77dae' },
  { name:'VS Code',     id:'vs2015',             bg:'#1e1e1e', chip:'#141414', chipFg:'#569cd6' },
  { name:'One Light',   id:'atom-one-light',     bg:'#fafafa', chip:'#e2e2e2', chipFg:'#4078f2' },
];

const LANG_BADGE = {
  javascript:'JS', typescript:'TS', python:'PY', rust:'RS', go:'GO',
  java:'JAVA', c:'C', cpp:'C++', css:'CSS', html:'HTML', sql:'SQL',
  shell:'SH', yaml:'YML', json:'JSON', ruby:'RB', php:'PHP',
  swift:'SW', kotlin:'KT', r:'R', scala:'SC'
};

const BG_PRESETS = [
  'linear-gradient(135deg,#7c6af7,#4facfe)',
  'linear-gradient(135deg,#f7706a,#f5af19)',
  'linear-gradient(135deg,#0fd850,#f9f047)',
  'linear-gradient(135deg,#fc5c7d,#6a3093)',
  'linear-gradient(135deg,#43c6ac,#191654)',
  'linear-gradient(135deg,#f953c6,#b91d73)',
  'linear-gradient(135deg,#1a1a2e,#16213e)',
  'linear-gradient(135deg,#d0d0d0,#ffffff)',
];

const DEFAULT_CODE = `async function fetchUserData(userId) {
  const cache = new Map();

  if (cache.has(userId)) {
    return cache.get(userId);
  }

  try {
    const response = await fetch(\`/api/users/\${userId}\`);
    if (!response.ok) throw new Error(\`HTTP \${response.status}\`);

    const data = await response.json();
    cache.set(userId, data);
    return data;
  } catch (err) {
    console.error('Failed to fetch user:', err);
    throw err;
  }
}`;

let rawCode = DEFAULT_CODE;
let activeTheme = THEMES[0];
let isEditing = false;
let openPanel = null;

/* ── PANELS ── */
const PANEL_MAP = { theme:'pop-theme', bg:'pop-bg', layout:'pop-layout', opts:'pop-opts' };
const BTN_MAP   = { theme:'rb-theme',  bg:'rb-bg',  layout:'rb-layout',  opts:'rb-opts'  };

function togglePanel(name) {
  if (openPanel === name) { closeAllPanels(); return; }
  closeAllPanels();
  openPanel = name;
  document.getElementById(PANEL_MAP[name]).classList.add('open');
  document.getElementById(BTN_MAP[name]).classList.add('active');
}

function closeAllPanels() {
  document.querySelectorAll('.popover').forEach(p => p.classList.remove('open'));
  document.querySelectorAll('.rail-btn').forEach(b => b.classList.remove('active'));
  openPanel = null;
}

document.addEventListener('click', e => {
  if (!e.target.closest('#rail') && !e.target.closest('.popover')) closeAllPanels();
});

/* ── RENDER ── */
function renderCode() {
  const lang = document.getElementById('lang').value;
  const lines = rawCode.split('\n');
  document.getElementById('line-nums').textContent = lines.map((_, i) => i + 1).join('\n');
  try {
    const r = hljs.highlight(rawCode, { language: lang, ignoreIllegals: true });
    document.getElementById('code-rendered').innerHTML = r.value;
  } catch(e) {
    document.getElementById('code-rendered').textContent = rawCode;
  }
}

/* ── INLINE EDIT ── */
const ta         = document.getElementById('code-ta');
const rendered   = document.getElementById('code-rendered');
const editHint   = document.getElementById('edit-hint');
const codeBlock  = document.getElementById('code-block');

function enterEdit() {
  if (isEditing) return;
  isEditing = true;
  closeAllPanels();
  ta.value = rawCode;
  // offset textarea left by line-number column width
  const lnW = document.getElementById('line-nums').offsetWidth;
  ta.style.paddingTop    = '18px';
  ta.style.paddingBottom = '18px';
  ta.style.paddingLeft   = `${20 + lnW + 18}px`;
  ta.style.paddingRight  = '20px';
  ta.style.display = 'block';
  rendered.style.opacity = '0.15';
  editHint.style.opacity = '0';
  syncTaHeight();
  ta.focus();
}

function exitEdit() {
  if (!isEditing) return;
  isEditing = false;
  rawCode = ta.value;
  ta.style.display = 'none';
  rendered.style.opacity = '1';
  editHint.style.opacity = '1';
  renderCode();
}

function syncTaHeight() {
  ta.style.height = 'auto';
  ta.style.height = (ta.scrollHeight) + 'px';
}

rendered.addEventListener('click', enterEdit);
codeBlock.addEventListener('click', e => {
  if (e.target === codeBlock) enterEdit();
});

ta.addEventListener('input', syncTaHeight);
ta.addEventListener('keydown', e => {
  if (e.key === 'Escape') exitEdit();
  if (e.key === 'Tab') {
    e.preventDefault();
    const s = ta.selectionStart;
    ta.value = ta.value.substring(0, s) + '  ' + ta.value.substring(ta.selectionEnd);
    ta.selectionStart = ta.selectionEnd = s + 2;
    syncTaHeight();
  }
});
ta.addEventListener('blur', exitEdit);

/* ── CONTROLS ── */
function onLangChange() {
  const l = document.getElementById('lang').value;
  document.getElementById('lang-badge').textContent = LANG_BADGE[l] || l.slice(0,4).toUpperCase();
  renderCode();
}

function applyTheme(t, el) {
  activeTheme = t;
  document.querySelectorAll('.tchip').forEach(c => { c.classList.remove('on'); c.style.borderColor = 'transparent'; });
  el.classList.add('on'); el.style.borderColor = 'rgba(139,124,248,0.9)';
  document.getElementById('hljs-theme').href =
    `https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/${t.id}.min.css`;
  document.getElementById('code-block').style.background = t.bg + 'cc';
  setTimeout(renderCode, 80);
}

function setPad(v)    { document.getElementById('v-pad').textContent = v;   document.getElementById('card-inner').style.padding = v + 'px'; }
function setWidth(v)  { document.getElementById('v-width').textContent = v; document.getElementById('code-card').style.maxWidth = v + 'px'; }
function setRadius(v) { document.getElementById('v-rad').textContent = v;   document.getElementById('code-card').style.borderRadius = v + 'px'; document.getElementById('code-block').style.borderRadius = Math.max(0, v - 5) + 'px'; }
function setFont(v)   { document.getElementById('v-font').textContent = v;  document.getElementById('code-lines').style.fontSize = v + 'px'; ta.style.fontSize = v + 'px'; }
function setLines()   { document.getElementById('line-nums').style.display   = document.getElementById('t-lines').checked ? 'block' : 'none'; }
function setBadge()   { document.getElementById('lang-badge').style.display  = document.getElementById('t-badge').checked ? 'inline-block' : 'none'; }

function pickBg(bg, el) {
  document.querySelectorAll('.sw').forEach(s => s.classList.remove('on'));
  el.classList.add('on');
  document.getElementById('card-bg').style.background = bg;
}
function customBg(val) {
  document.querySelectorAll('.sw').forEach(s => s.classList.remove('on'));
  document.getElementById('card-bg').style.background = val;
}

/* ── BUILD UI ── */
function buildThemes() {
  const grid = document.getElementById('theme-grid');
  THEMES.forEach((t, i) => {
    const c = document.createElement('div');
    c.className = 'tchip' + (i === 0 ? ' on' : '');
    c.style.cssText = `background:${t.chip};color:${t.chipFg};border-color:${i === 0 ? 'rgba(139,124,248,0.9)' : 'transparent'}`;
    c.textContent = t.name;
    c.onclick = () => applyTheme(t, c);
    grid.appendChild(c);
  });
}

function buildSwatches() {
  const wrap = document.getElementById('swatches');
  BG_PRESETS.forEach((bg, i) => {
    const s = document.createElement('div');
    s.className = 'sw' + (i === 0 ? ' on' : '');
    s.style.background = bg;
    s.onclick = () => pickBg(bg, s);
    wrap.appendChild(s);
  });
  const cu = document.createElement('div');
  cu.className = 'sw-custom'; cu.title = 'Custom';
  cu.innerHTML = `+<input type="color" value="#7c6af7" oninput="customBg(this.value)">`;
  wrap.appendChild(cu);
}

/* ── EXPORT ── */
async function doExport(fmt) {
  if (isEditing) exitEdit();

  if (fmt === 'pdf') {
    const s = document.createElement('style');
    s.textContent = `@media print{body *{visibility:hidden}#stage,#stage *{visibility:visible}#stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#0b0b14!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}}`;
    document.head.appendChild(s); window.print(); setTimeout(() => s.remove(), 1000);
    return;
  }

  try {
    const card = document.getElementById('code-card');
    const canvas = await html2canvas(card, { backgroundColor: null, scale: 2, useCORS: true, allowTaint: true, logging: false });
    const mime = fmt === 'jpeg' ? 'image/jpeg' : 'image/png';
    const a = document.createElement('a');
    a.href = canvas.toDataURL(mime, 0.96); a.download = `nimbus.${fmt}`; a.click();
    toast(`${fmt.toUpperCase()} saved`);
  } catch(e) { toast('Export failed'); }
}

function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2200);
}

/* ── INIT ── */
buildThemes();
buildSwatches();
document.getElementById('card-bg').style.background = BG_PRESETS[0];
document.getElementById('code-block').style.background = activeTheme.bg + 'cc';
renderCode();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Nimbus — Minimal Code Snapshots</title>
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'system-ui', '-apple-system', 'sans-serif'],
            mono: ['"JetBrains Mono"', 'monospace'],
          },
          colors: {
            surface: {
              50: '#18181b',
              100: '#27272a',
              200: '#3f3f46',
              800: '#09090b',
              900: '#040405',
            }
          }
        }
      }
    };
  </script>

  <!-- Highlight.js and html2canvas -->
  <link id="hljs-theme" rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-dark.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

  <style>
    /* Custom scrollbar */
    ::-webkit-scrollbar { width: 5px; height: 5px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.15); border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: rgba(255, 255, 255, 0.25); }

    /* Custom range input */
    input[type="range"] {
      -webkit-appearance: none;
      appearance: none;
      height: 4px;
      border-radius: 2px;
      background: #27272a;
      outline: none;
    }
    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: #ffffff;
      cursor: pointer;
      box-shadow: 0 0 10px rgba(0,0,0,0.5);
      transition: transform 0.1s ease, background-color 0.15s ease;
    }
    input[type="range"]::-webkit-slider-thumb:hover {
      transform: scale(1.15);
    }
    input[type="range"]::-webkit-slider-thumb:active {
      transform: scale(0.95);
      background: #e4e4e7;
    }

    /* Code Container Pre styling */
    #code-rendered pre {
      margin: 0 !important;
      padding: 0 !important;
      background: transparent !important;
      font-family: inherit !important;
      font-size: inherit !important;
      line-height: inherit !important;
      tab-size: 2;
    }
    #code-rendered code.hljs {
      padding: 0 !important;
      background: transparent !important;
      font-family: inherit !important;
      font-size: inherit !important;
      line-height: inherit !important;
      color: inherit;
    }

    /* Subtle mesh backdrop pattern */
    .bg-grid-pattern {
      background-size: 32px 32px;
      background-image: 
        linear-gradient(to right, rgba(255, 255, 255, 0.03) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
    }

    /* Glass pill */
    .glass-panel {
      background: rgba(18, 18, 22, 0.75);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }

    /* Smooth scale container for mobile preview */
    #preview-stage {
      transition: transform 0.2s cubic-bezier(0.16, 1, 0.3, 1);
      transform-origin: center center;
    }
  </style>
</head>
<body class="h-full bg-[#09090b] text-zinc-100 font-sans select-none overflow-hidden flex flex-col">

  <!-- Top Navigation Header -->
  <header class="h-14 border-b border-white/[0.07] bg-surface-900/80 backdrop-blur-md px-4 flex items-center justify-between shrink-0 z-30">
    <div class="flex items-center gap-3">
      <div class="flex items-center gap-2">
        <div class="w-7 h-7 rounded-lg bg-gradient-to-tr from-violet-600 to-indigo-400 flex items-center justify-center shadow-lg shadow-indigo-500/20">
          <svg class="w-4 h-4 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
            <path stroke-linecap="round" stroke-linejoin="round" d="M10 20l4-16m4 4l4 4-4 4M6 16l-4-4 4-4" />
          </svg>
        </div>
        <span class="font-semibold text-sm tracking-tight text-white">Nimbus</span>
      </div>
      <span class="hidden sm:inline-block text-[11px] font-mono font-medium px-2 py-0.5 rounded-full bg-white/[0.06] text-zinc-400 border border-white/[0.05]">
        v2.0 Minimal
      </span>
    </div>

    <!-- Right Header Actions -->
    <div class="flex items-center gap-2">
      <!-- Quick toggle editor button on mobile -->
      <button onclick="toggleEditorDrawer()" class="md:hidden flex items-center gap-1.5 px-3 py-1.5 rounded-lg bg-white/[0.08] hover:bg-white/[0.12] text-xs font-medium text-zinc-200 transition">
        <svg class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z" />
        </svg>
        <span>Code</span>
      </button>

      <!-- Copy to Clipboard -->
      <button onclick="copySnippetImage()" class="flex items-center gap-1.5 px-3 py-1.5 rounded-lg bg-white/[0.06] hover:bg-white/[0.1] text-xs font-medium text-zinc-300 border border-white/[0.06] transition active:scale-95" title="Copy high-res image">
        <svg class="w-3.5 h-3.5 text-zinc-400" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z" />
        </svg>
        <span class="hidden sm:inline">Copy Image</span>
      </button>

      <!-- Export PNG Button -->
      <button onclick="exportSnapshot('png')" class="flex items-center gap-1.5 px-3.5 py-1.5 rounded-lg bg-white text-zinc-950 hover:bg-zinc-200 text-xs font-semibold shadow-sm transition active:scale-95">
        <svg class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
          <path stroke-linecap="round" stroke-linejoin="round" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4" />
        </svg>
        <span>Export</span>
      </button>
    </div>
  </header>

  <main class="flex-1 flex flex-col md:flex-row overflow-hidden relative">
    
    <!-- LEFT/BOTTOM CONTROLS PANEL -->
    <aside id="controls-panel" class="order-2 md:order-1 w-full md:w-80 lg:w-96 border-t md:border-t-0 md:border-r border-white/[0.07] bg-surface-900 flex flex-col z-20 transition-all duration-300 max-h-[48vh] md:max-h-full">
      
      <!-- Panel Tabs -->
      <div class="flex items-center border-b border-white/[0.06] px-3 pt-2 gap-1 shrink-0 bg-surface-900">
        <button id="tab-btn-style" onclick="switchTab('style')" class="flex-1 py-2 text-xs font-medium text-white border-b-2 border-indigo-500 transition text-center">
          Appearance
        </button>
        <button id="tab-btn-code" onclick="switchTab('code')" class="flex-1 py-2 text-xs font-medium text-zinc-400 border-b-2 border-transparent hover:text-zinc-200 transition text-center">
          Editor & Code
        </button>
      </div>

      <!-- Tab 1: Appearance & Styles -->
      <div id="tab-content-style" class="flex-1 overflow-y-auto p-4 space-y-5">
        
        <!-- Background Gradient Selection -->
        <div>
          <label class="block text-[11px] font-semibold uppercase tracking-wider text-zinc-400 mb-2.5">Backdrop Theme</label>
          <div class="grid grid-cols-6 gap-2" id="gradient-palette">
            <!-- Dynamically populated or static swatches -->
          </div>
        </div>

        <!-- Syntax Theme -->
        <div>
          <label class="block text-[11px] font-semibold uppercase tracking-wider text-zinc-400 mb-2">Code Highlighter</label>
          <div class="grid grid-cols-2 gap-1.5" id="theme-selectors">
            <button onclick="setTheme('atom-one-dark', '#1e1e24', '#abb2bf', this)" class="theme-btn active px-3 py-2 rounded-lg bg-white/[0.05] border border-white/10 text-left text-xs font-medium text-white flex items-center justify-between">
              <span>One Dark</span>
              <span class="w-2 h-2 rounded-full bg-emerald-400"></span>
            </button>
            <button onclick="setTheme('dracula', '#282a36', '#f8f8f2', this)" class="theme-btn px-3 py-2 rounded-lg bg-white/[0.03] border border-transparent text-left text-xs font-medium text-zinc-400 hover:text-white flex items-center justify-between">
              <span>Dracula</span>
              <span class="w-2 h-2 rounded-full bg-purple-400"></span>
            </button>
            <button onclick="setTheme('tokyo-night-dark', '#1a1b26', '#a9b1d6', this)" class="theme-btn px-3 py-2 rounded-lg bg-white/[0.03] border border-transparent text-left text-xs font-medium text-zinc-400 hover:text-white flex items-center justify-between">
              <span>Tokyo Night</span>
              <span class="w-2 h-2 rounded-full bg-blue-400"></span>
            </button>
            <button onclick="setTheme('atom-one-light', '#f8fafc', '#334155', this)" class="theme-btn px-3 py-2 rounded-lg bg-white/[0.03] border border-transparent text-left text-xs font-medium text-zinc-400 hover:text-white flex items-center justify-between">
              <span>Paper Light</span>
              <span class="w-2 h-2 rounded-full bg-amber-200"></span>
            </button>
          </div>
        </div>

        <!-- Sliders Group -->
        <div class="space-y-4 pt-1">
          <!-- Padding -->
          <div>
            <div class="flex justify-between items-center text-xs mb-1.5">
              <span class="text-zinc-400 font-medium">Padding</span>
              <span id="label-padding" class="font-mono text-[11px] text-zinc-300">40px</span>
            </div>
            <input type="range" min="16" max="96" value="40" class="w-full" oninput="updateConfig('padding', this.value)">
          </div>

          <!-- Font Size -->
          <div>
            <div class="flex justify-between items-center text-xs mb-1.5">
              <span class="text-zinc-400 font-medium">Font Scale</span>
              <span id="label-font" class="font-mono text-[11px] text-zinc-300">14px</span>
            </div>
            <input type="range" min="12" max="22" value="14" class="w-full" oninput="updateConfig('fontSize', this.value)">
          </div>

          <!-- Card Corner Radius -->
          <div>
            <div class="flex justify-between items-center text-xs mb-1.5">
              <span class="text-zinc-400 font-medium">Window Radius</span>
              <span id="label-radius" class="font-mono text-[11px] text-zinc-300">14px</span>
            </div>
            <input type="range" min="4" max="28" value="14" class="w-full" oninput="updateConfig('radius', this.value)">
          </div>

          <!-- Shadow Elevation -->
          <div>
            <div class="flex justify-between items-center text-xs mb-1.5">
              <span class="text-zinc-400 font-medium">Elevation Shadow</span>
              <span id="label-shadow" class="font-mono text-[11px] text-zinc-300">Medium</span>
            </div>
            <input type="range" min="0" max="3" value="2" class="w-full" oninput="updateConfig('shadow', this.value)">
          </div>
        </div>

        <!-- Toggles -->
        <div class="pt-2 border-t border-white/[0.06] space-y-3">
          <div class="flex items-center justify-between">
            <span class="text-xs text-zinc-300 font-medium">Window Header</span>
            <label class="relative inline-flex items-center cursor-pointer">
              <input type="checkbox" id="toggle-header" checked onchange="updateConfig('showHeader', this.checked)" class="sr-only peer">
              <div class="w-9 h-5 bg-zinc-800 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:rounded-full after:h-4 after:w-4 after:transition-all peer-checked:bg-indigo-600"></div>
            </label>
          </div>

          <div class="flex items-center justify-between">
            <span class="text-xs text-zinc-300 font-medium">Line Numbers</span>
            <label class="relative inline-flex items-center cursor-pointer">
              <input type="checkbox" id="toggle-linenums" checked onchange="updateConfig('showLineNums', this.checked)" class="sr-only peer">
              <div class="w-9 h-5 bg-zinc-800 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:rounded-full after:h-4 after:w-4 after:transition-all peer-checked:bg-indigo-600"></div>
            </label>
          </div>

          <div class="flex items-center justify-between">
            <span class="text-xs text-zinc-300 font-medium">Watermark</span>
            <label class="relative inline-flex items-center cursor-pointer">
              <input type="checkbox" id="toggle-watermark" checked onchange="updateConfig('showWatermark', this.checked)" class="sr-only peer">
              <div class="w-9 h-5 bg-zinc-800 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:rounded-full after:h-4 after:w-4 after:transition-all peer-checked:bg-indigo-600"></div>
            </label>
          </div>
        </div>

      </div>

      <!-- Tab 2: Code Editor -->
      <div id="tab-content-code" class="hidden flex-1 overflow-y-auto p-4 space-y-4 flex flex-col">
        <div>
          <label class="block text-[11px] font-semibold uppercase tracking-wider text-zinc-400 mb-1.5">Language</label>
          <select id="code-lang" onchange="updateLanguage(this.value)" class="w-full bg-zinc-800/80 border border-white/10 rounded-lg px-3 py-2 text-xs font-medium text-zinc-200 outline-none focus:border-indigo-500 cursor-pointer">
            <option value="javascript">JavaScript</option>
            <option value="typescript">TypeScript</option>
            <option value="python">Python</option>
            <option value="rust">Rust</option>
            <option value="go">Go</option>
            <option value="html">HTML</option>
            <option value="css">CSS</option>
            <option value="sql">SQL</option>
            <option value="bash">Bash / Shell</option>
            <option value="json">JSON</option>
          </select>
        </div>

        <div>
          <label class="block text-[11px] font-semibold uppercase tracking-wider text-zinc-400 mb-1.5">File Title / Path</label>
          <input type="text" id="window-title-input" value="serviceWorker.ts" oninput="updateWindowTitle(this.value)" class="w-full bg-zinc-800/80 border border-white/10 rounded-lg px-3 py-2 text-xs font-mono text-zinc-200 outline-none focus:border-indigo-500">
        </div>

        <div class="flex-1 flex flex-col min-h-[220px]">
          <label class="block text-[11px] font-semibold uppercase tracking-wider text-zinc-400 mb-1.5">Source Snippet</label>
          <textarea id="code-input" spellcheck="false" class="w-full flex-1 min-h-[180px] bg-zinc-950/80 border border-white/10 rounded-lg p-3 text-xs font-mono text-zinc-200 outline-none focus:border-indigo-500 resize-none leading-relaxed" oninput="onCodeChange(this.value)"></textarea>
        </div>
      </div>

    </aside>

    <!-- PREVIEW STAGE AREA -->
    <section class="order-1 md:order-2 flex-1 relative bg-grid-pattern overflow-auto flex items-center justify-center p-4 sm:p-8 md:p-12">
      
      <!-- Stage Wrapper for Scaling on narrow mobile screens -->
      <div id="stage-wrapper" class="w-full flex items-center justify-center">
        
        <!-- The actual capture card -->
        <div id="capture-container" class="relative transition-all duration-300 flex items-center justify-center shadow-2xl" style="padding: 40px; border-radius: 20px;">
          
          <!-- Background Gradient Canvas Layer -->
          <div id="card-background-layer" class="absolute inset-0 rounded-[inherit] transition-all duration-300 z-0"></div>

          <!-- Code Window Container -->
          <div id="code-window" class="relative z-10 w-full max-w-[640px] min-w-[280px] sm:min-w-[360px] overflow-hidden transition-all duration-200 border border-white/10 shadow-2xl backdrop-blur-xl">
            
            <!-- Window Titlebar -->
            <div id="window-header" class="h-10 px-4 border-b border-white/[0.08] flex items-center justify-between select-none">
              <!-- MacOS Traffic Lights -->
              <div class="flex items-center gap-2">
                <span class="w-3 h-3 rounded-full bg-[#ff5f56] border border-black/10 inline-block"></span>
                <span class="w-3 h-3 rounded-full bg-[#ffbd2e] border border-black/10 inline-block"></span>
                <span class="w-3 h-3 rounded-full bg-[#27c93f] border border-black/10 inline-block"></span>
              </div>

              <!-- Title / Filename -->
              <div id="window-title-display" class="font-mono text-[11px] text-zinc-400 font-medium tracking-tight truncate max-w-[200px]">
                serviceWorker.ts
              </div>

              <!-- Language Tag or Indicator -->
              <div class="flex items-center gap-1.5">
                <span id="lang-indicator" class="text-[10px] font-mono font-medium px-1.5 py-0.5 rounded bg-white/[0.08] text-zinc-400 uppercase tracking-wider">
                  TS
                </span>
              </div>
            </div>

            <!-- Code Content Body -->
            <div id="code-content-wrapper" class="p-5 overflow-x-auto">
              <div class="flex gap-4 font-mono text-[14px] leading-relaxed">
                <!-- Line Numbers -->
                <div id="line-numbers" class="select-none text-zinc-600 text-right shrink-0 pr-1 tabular-nums font-mono"></div>
                <!-- Highlighted Code Element -->
                <div id="code-rendered" class="flex-1 whitespace-pre outline-none"></div>
              </div>
            </div>

            <!-- Minimal Watermark Footer (Optional) -->
            <div id="card-watermark" class="px-4 py-2 border-t border-white/[0.04] flex items-center justify-between text-[10px] font-mono text-zinc-500">
              <span class="opacity-70">Nimbus Code Studio</span>
              <span class="opacity-40 tracking-wider">UTF-8</span>
            </div>

          </div>

        </div>

      </div>

    </section>

  </main>

  <!-- Shutter Flash Overlay for Photo Capture Effect -->
  <div id="shutter-flash" class="fixed inset-0 bg-white opacity-0 pointer-events-none transition-opacity duration-150 z-50"></div>

  <!-- Minimalist Toast Notification -->
  <div id="toast" class="fixed bottom-6 left-1/2 -translate-x-1/2 z-50 px-4 py-2.5 rounded-full bg-zinc-900/90 text-white text-xs font-medium border border-white/10 shadow-2xl backdrop-blur-md opacity-0 translate-y-3 pointer-events-none transition-all duration-200 flex items-center gap-2">
    <svg id="toast-icon" class="w-4 h-4 text-emerald-400" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
      <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7" />
    </svg>
    <span id="toast-text">Snapshot downloaded</span>
  </div>

  <script>
    // Initial State Configuration
    const PRESET_GRADIENTS = [
      { id: 'aurora', name: 'Aurora', css: 'linear-gradient(135deg, #4f46e5 0%, #7c3aed 50%, #db2777 100%)' },
      { id: 'sunset', name: 'Sunset Glow', css: 'linear-gradient(135deg, #f97316 0%, #ec4899 50%, #8b5cf6 100%)' },
      { id: 'emerald', name: 'Emerald Wave', css: 'linear-gradient(135deg, #059669 0%, #10b981 50%, #06b6d4 100%)' },
      { id: 'midnight', name: 'Deep Space', css: 'linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #311042 100%)' },
      { id: 'obsidian', name: 'Monochrome', css: 'linear-gradient(135deg, #18181b 0%, #27272a 100%)' },
      { id: 'candy', name: 'Cyber Candy', css: 'linear-gradient(135deg, #06b6d4 0%, #3b82f6 50%, #9333ea 100%)' },
    ];

    const DEFAULT_CODE = `// Fast cache responder with stale-while-revalidate
async function handleRequest(request: Request): Promise<Response> {
  const cache = await caches.open("v2-runtime");
  const cachedResponse = await cache.match(request);

  const fetchPromise = fetch(request).then(networkResponse => {
    if (networkResponse.status === 200) {
      cache.put(request, networkResponse.clone());
    }
    return networkResponse;
  });

  return cachedResponse || fetchPromise;
}`;

    const config = {
      code: DEFAULT_CODE,
      lang: 'typescript',
      title: 'serviceWorker.ts',
      theme: 'atom-one-dark',
      themeBg: '#18181b',
      themeColor: '#abb2bf',
      gradientId: 'aurora',
      padding: 40,
      fontSize: 14,
      radius: 14,
      shadow: 2,
      showHeader: true,
      showLineNums: true,
      showWatermark: true,
    };

    // DOM Elements Cache
    const codeInput = document.getElementById('code-input');
    const codeRendered = document.getElementById('code-rendered');
    const lineNumbers = document.getElementById('line-numbers');
    const windowHeader = document.getElementById('window-header');
    const windowTitleDisplay = document.getElementById('window-title-display');
    const windowTitleInput = document.getElementById('window-title-input');
    const langIndicator = document.getElementById('lang-indicator');
    const cardBgLayer = document.getElementById('card-background-layer');
    const captureContainer = document.getElementById('capture-container');
    const codeWindow = document.getElementById('code-window');
    const cardWatermark = document.getElementById('card-watermark');
    const toastEl = document.getElementById('toast');
    const toastText = document.getElementById('toast-text');
    const hljsThemeLink = document.getElementById('hljs-theme');

    // Build Gradient Swatches in Control Panel
    function initGradientPalette() {
      const container = document.getElementById('gradient-palette');
      container.innerHTML = '';
      PRESET_GRADIENTS.forEach((item, index) => {
        const btn = document.createElement('button');
        btn.className = `w-8 h-8 rounded-full transition-transform active:scale-90 border-2 ${
          config.gradientId === item.id ? 'border-white scale-110 shadow-lg' : 'border-transparent hover:scale-105'
        }`;
        btn.style.background = item.css;
        btn.title = item.name;
        btn.onclick = () => selectGradient(item.id);
        container.appendChild(btn);
      });
    }

    function selectGradient(gradientId) {
      config.gradientId = gradientId;
      const found = PRESET_GRADIENTS.find(g => g.id === gradientId);
      if (found) {
        cardBgLayer.style.background = found.css;
      }
      initGradientPalette();
    }

    // Render Syntax Highlighted Code
    function render() {
      const code = config.code;
      const lines = code.split('\n');
      
      // Update line numbering
      if (config.showLineNums) {
        lineNumbers.style.display = 'block';
        lineNumbers.textContent = lines.map((_, i) => i + 1).join('\n');
      } else {
        lineNumbers.style.display = 'none';
      }

      // Highlight syntax using Highlight.js
      try {
        const highlighted = hljs.highlight(code, {
          language: config.lang,
          ignoreIllegals: true
        });
        codeRendered.innerHTML = `<pre><code class="hljs">${highlighted.value}</code></pre>`;
      } catch (err) {
        codeRendered.innerHTML = `<pre><code class="hljs">${escapeHtml(code)}</code></pre>`;
      }

      // Sync window meta
      windowTitleDisplay.textContent = config.title;
      langIndicator.textContent = getLangShort(config.lang);
    }

    function escapeHtml(text) {
      return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }

    function getLangShort(lang) {
      const map = {
        javascript: 'JS',
        typescript: 'TS',
        python: 'PY',
        rust: 'RS',
        go: 'GO',
        html: 'HTML',
        css: 'CSS',
        sql: 'SQL',
        bash: 'SH',
        json: 'JSON'
      };
      return map[lang] || lang.substring(0, 3).toUpperCase();
    }

    function onCodeChange(val) {
      config.code = val;
      render();
    }

    function updateLanguage(val) {
      config.lang = val;
      render();
    }

    function updateWindowTitle(val) {
      config.title = val || 'untitled';
      windowTitleDisplay.textContent = config.title;
    }

    function setTheme(themeId, bgColor, textColor, btnElement) {
      config.theme = themeId;
      config.themeBg = bgColor;
      config.themeColor = textColor;

      // Update stylesheet link
      hljsThemeLink.href = `https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/${themeId}.min.css`;
      
      // Apply card window background
      codeWindow.style.backgroundColor = bgColor;
      codeRendered.style.color = textColor;

      // Update button active state
      document.querySelectorAll('.theme-btn').forEach(btn => {
        btn.classList.remove('active', 'border-white/10', 'bg-white/[0.05]');
        btn.classList.add('border-transparent', 'bg-white/[0.03]');
      });
      if (btnElement) {
        btnElement.classList.add('active', 'border-white/10', 'bg-white/[0.05]');
        btnElement.classList.remove('border-transparent');
      }

      setTimeout(render, 30);
    }

    function updateConfig(prop, val) {
      if (prop === 'padding') {
        config.padding = val;
        captureContainer.style.padding = `${val}px`;
        document.getElementById('label-padding').textContent = `${val}px`;
      } else if (prop === 'fontSize') {
        config.fontSize = val;
        codeRendered.style.fontSize = `${val}px`;
        lineNumbers.style.fontSize = `${val}px`;
        document.getElementById('label-font').textContent = `${val}px`;
      } else if (prop === 'radius') {
        config.radius = val;
        codeWindow.style.borderRadius = `${val}px`;
        document.getElementById('label-radius').textContent = `${val}px`;
      } else if (prop === 'shadow') {
        config.shadow = val;
        const shadowMap = [
          'none',
          '0 10px 25px -5px rgba(0,0,0,0.3)',
          '0 25px 50px -12px rgba(0,0,0,0.45)',
          '0 35px 80px -15px rgba(0,0,0,0.6)'
        ];
        const labelMap = ['None', 'Soft', 'Medium', 'Heavy'];
        codeWindow.style.boxShadow = shadowMap[val];
        document.getElementById('label-shadow').textContent = labelMap[val];
      } else if (prop === 'showHeader') {
        config.showHeader = val;
        windowHeader.style.display = val ? 'flex' : 'none';
      } else if (prop === 'showLineNums') {
        config.showLineNums = val;
        render();
      } else if (prop === 'showWatermark') {
        config.showWatermark = val;
        cardWatermark.style.display = val ? 'flex' : 'none';
      }
    }

    function switchTab(tabId) {
      const styleTab = document.getElementById('tab-content-style');
      const codeTab = document.getElementById('tab-content-code');
      const styleBtn = document.getElementById('tab-btn-style');
      const codeBtn = document.getElementById('tab-btn-code');

      if (tabId === 'style') {
        styleTab.classList.remove('hidden');
        codeTab.classList.add('hidden');
        styleBtn.className = "flex-1 py-2 text-xs font-medium text-white border-b-2 border-indigo-500 transition text-center";
        codeBtn.className = "flex-1 py-2 text-xs font-medium text-zinc-400 border-b-2 border-transparent hover:text-zinc-200 transition text-center";
      } else {
        styleTab.classList.add('hidden');
        codeTab.classList.remove('hidden');
        codeBtn.className = "flex-1 py-2 text-xs font-medium text-white border-b-2 border-indigo-500 transition text-center";
        styleBtn.className = "flex-1 py-2 text-xs font-medium text-zinc-400 border-b-2 border-transparent hover:text-zinc-200 transition text-center";
      }
    }

    function toggleEditorDrawer() {
      switchTab('code');
      const panel = document.getElementById('controls-panel');
      panel.scrollIntoView({ behavior: 'smooth' });
    }

    // Tab key inside textarea support
    codeInput.addEventListener('keydown', (e) => {
      if (e.key === 'Tab') {
        e.preventDefault();
        const start = codeInput.selectionStart;
        const end = codeInput.selectionEnd;
        codeInput.value = codeInput.value.substring(0, start) + '  ' + codeInput.value.substring(end);
        codeInput.selectionStart = codeInput.selectionEnd = start + 2;
        onCodeChange(codeInput.value);
      }
    });

    async function exportSnapshot(format = 'png') {
      const flash = document.getElementById('shutter-flash');
      flash.style.opacity = '0.9';
      setTimeout(() => { flash.style.opacity = '0'; }, 180);

      try {
        const canvas = await html2canvas(captureContainer, {
          backgroundColor: null,
          scale: 3, // High DPI retina export
          useCORS: true,
          logging: false,
          allowTaint: true,
        });

        const mime = format === 'jpeg' ? 'image/jpeg' : 'image/png';
        const link = document.createElement('a');
        link.download = `${config.title.replace(/\.[^/.]+$/, "")}-nimbus.${format}`;
        link.href = canvas.toDataURL(mime, 0.95);
        link.click();
        showToast('Snapshot exported successfully!');
      } catch (err) {
        showToast('Export failed. Please try again.');
      }
    }

    async function copySnippetImage() {
      showToast('Generating snapshot...');
      try {
        const canvas = await html2canvas(captureContainer, {
          backgroundColor: null,
          scale: 2.5,
          useCORS: true,
          logging: false,
        });

        canvas.toBlob(async (blob) => {
          if (!blob) {
            showToast('Unable to create image blob');
            return;
          }
          try {
            // Standard Clipboard Item
            const item = new ClipboardItem({ 'image/png': blob });
            await navigator.clipboard.write([item]);
            showToast('Image copied to clipboard!');
          } catch (err) {
            // Fallback for sandboxed or unsupported iFrames
            const link = document.createElement('a');
            link.download = `snippet.png`;
            link.href = canvas.toDataURL('image/png');
            link.click();
            showToast('Direct copy blocked: image downloaded');
          }
        }, 'image/png');
      } catch (err) {
        showToast('Failed to copy image');
      }
    }

    function showToast(message) {
      toastText.textContent = message;
      toastEl.classList.remove('opacity-0', 'translate-y-3', 'pointer-events-none');
      toastEl.classList.add('opacity-100', 'translate-y-0');

      setTimeout(() => {
        toastEl.classList.add('opacity-0', 'translate-y-3', 'pointer-events-none');
        toastEl.classList.remove('opacity-100', 'translate-y-0');
      }, 2500);
    }

    window.addEventListener('DOMContentLoaded', () => {
      // Sync initial UI values
      codeInput.value = config.code;
      windowTitleInput.value = config.title;
      document.getElementById('code-lang').value = config.lang;

      // Set initial styles
      initGradientPalette();
      selectGradient('aurora');
      updateConfig('padding', config.padding);
      updateConfig('fontSize', config.fontSize);
      updateConfig('radius', config.radius);
      updateConfig('shadow', config.shadow);

      codeWindow.style.backgroundColor = config.themeBg;
      codeRendered.style.color = config.themeColor;

      render();
    });
  </script>
</body>
</html>
